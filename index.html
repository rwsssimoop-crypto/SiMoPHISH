<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location Verification</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 90%;
            width: 350px;
        }
        h2 { color: #333; margin-bottom: 0.5rem; }
        p { color: #666; font-size: 0.9rem; margin-bottom: 1.5rem; }
        button {
            background-color: #2ea44f;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }
        button:hover { background-color: #2c974b; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        
        #result {
            margin-top: 1.5rem;
            text-align: left;
            display: none; /* Hidden until data is found */
        }
        .data-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }
        .label { font-weight: bold; color: #444; }
        .value { color: #2ea44f; font-family: monospace; }
        
        /* Loading spinner */
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 10px;
            vertical-align: middle;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="card">
    <h2>Verify Location</h2>
    <p>Click below to share your precise GPS coordinates.</p>
    
    <button id="btn" onclick="getLocation()">Share Location</button>
    
    <div id="result">
        <div class="data-row">
            <span class="label">Latitude:</span>
            <span class="value" id="lat">...</span>
        </div>
        <div class="data-row">
            <span class="label">Longitude:</span>
            <span class="value" id="lng">...</span>
        </div>
        <div class="data-row">
            <span class="label">Accuracy:</span>
            <span class="value" id="acc">...</span>
        </div>
        <div style="margin-top:10px; font-size: 0.8rem; color: #888;">
            <a href="https://www.google.com/maps?q=<id=lat>,<id=lng>" target="_blank" id="mapLink">View on Google Maps</a>
        </div>
    </div>
</div>

<script>
    function getLocation() {
        const btn = document.getElementById('btn');
        const resultDiv = document.getElementById('result');
        
        if (!navigator.geolocation) {
            alert("Geolocation is not supported by your browser");
            return;
        }

        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> Getting GPS...';

        // High accuracy options for mobile phones
        navigator.geolocation.getCurrentPosition(
            (position) => {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                const acc = position.coords.accuracy.toFixed(1);

                document.getElementById('lat').innerText = lat.toFixed(6);
                document.getElementById('lng').innerText = lng.toFixed(6);
                document.getElementById('acc').innerText = `±${acc}m`;
                
                // Create a Google Maps link dynamically
                const mapLink = document.getElementById('mapLink');
                mapLink.href = `https://www.google.com/maps?q=${lat},${lng}`;
                
                btn.style.display = 'none';
                resultDiv.style.display = 'block';
            },
            (error) => {
                btn.disabled = false;
                btn.innerText = "Try Again";
                let errorMsg = "Unknown error";
                switch(error.code) {
                    case error.PERMISSION_DENIED: errorMsg = "Permission denied. Allow location access."; break;
                    case error.POSITION_UNAVAILABLE: errorMsg = "Location unavailable."; break;
                    case error.TIMEOUT: errorMsg = "Request timed out."; break;
                }
                alert(errorMsg);
            },
            { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
    }
</script>

</body>
</html>
